workspace:
  packageSet:
    registry: 77.0.0
package:
  dependencies:
    - aff: ">=8.0.0 <9.0.0"
    - aff-promise: ">=4.0.0 <5.0.0"
    - argonaut: ">=9.0.0 <10.0.0"
    - arraybuffer
    - arraybuffer-builder
    - arrays: ">=7.3.0 <8.0.0"
    - effect: ">=4.0.0 <5.0.0"
    - either: ">=6.1.0 <7.0.0"
    - exceptions: ">=6.1.0 <7.0.0"
    - fetch-core: ">=5.1.0 <6.0.0"
    - float32
    - foreign-object: ">=4.1.0 <5.0.0"
    - identity: ">=6.0.0 <7.0.0"
    - int64
    - integers: ">=6.0.0 <7.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - newtype: ">=5.0.0 <6.0.0"
    - numbers: ">=9.0.1 <10.0.0"
    - prelude: ">=6.0.2 <7.0.0"
    - strings: ">=6.0.1 <7.0.0"
    - tailrec
    - transformers: ">=6.1.0 <7.0.0"
    - tuples: ">=7.0.0 <8.0.0"
    - uint
    - unicode: ">=6.0.0 <7.0.0"
    - unsafe-coerce: ">=6.0.0 <7.0.0"
    - web-encoding: ">=3.0.0 <4.0.0"
    - web-streams: ">=4.0.0 <5.0.0"
  name: msgpinc
  test:
    main: Test.Main
    censorTestWarnings:
      - ImplicitQualifiedImportReExport
      - ImplicitQualifiedImport
    dependencies:
      - spec-node
      - assert
      - debug
  publish:
    version: 0.5.1
    license: MIT
    exclude:
      - "examples/**"
    location:
      githubOwner: david-sledge
      githubRepo: purescript-msgpinc
